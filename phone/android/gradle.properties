org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dorg.gradle.daemon.host=127.0.0.1
org.gradle.daemon=false
# 强制使用 Microsoft JDK 17 启动 daemon（与客户端一致），绕开 JBR 21 daemon 通信问题
org.gradle.java.home=C:\\Program Files\\Microsoft\\jdk-17.0.11.9-hotspot
# 使用 named pipe 通信，绕开 Windows 127.0.0.1 TCP 连接被防火墙拦截的问题
org.gradle.daemon.transport=pipe
android.useAndroidX=true
