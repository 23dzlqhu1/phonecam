# gradle.properties — Gradle 启动参数
# 作用：固定 JVM 内存、禁用 daemon、强制使用 Microsoft JDK 17
# 复用 phone/ 工程的成熟配置（已踩过的坑）

# 1. JVM 内存
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError

# 2. 禁用 daemon（绕开 Windows 127.0.0.1 TCP 防火墙拦截问题，G-007）
org.gradle.daemon=false

# 3. 强制使用 Microsoft JDK 17（与 phone/ 一致，避免 JBR 21 daemon 通信问题）
org.gradle.java.home=C:\\Program Files\\Microsoft\\jdk-17.0.11.9-hotspot

# 4. 启用 AndroidX（必须）
android.useAndroidX=true

# 5. 不启用 R8 完整模式（先跑通，MVP 阶段不需要 release 优化）
android.enableR8.fullMode=false
