name: Build and publish release

# tag-based 复用 workflow:
#   push tag v* (如 v2.0.3 / v2.1.0 / v3.0.0) 时自动构建 Windows 安装包并发布 Release。
#   APP_VERSION 从 tag 名解析 (v2.0.3 → 2.0.3), 未来发新版本无需修改本文件。
#   workflow_dispatch 保留用于手工验证/发布。
#
# Android APK: 仓库未配置 signing secrets, 不在此 workflow 内重新构建;
#   Windows 安装包和 Release 复用上一版本已公开且通过哈希/签名门禁的正式 APK。

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/windows-release.yml
      - cpp/**
      - installer/**
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号 (不含 v 前缀), 例如 2.0.3'
        required: true
        default: '2.0.3'
        type: string
      publish_release:
        description: Publish or replace the assets in GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VCPKG_TAG: 2026.07.29
  VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
  VCPKG_DOWNLOADS: ${{ github.workspace }}\.vcpkg-downloads
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-bincache
  ANDROID_APK_RELEASE_TAG: v2.0.2
  ANDROID_APK_NAME: PhoneCam-Android-v0.2.9.apk
  ANDROID_APK_SHA256: fc4b3101ac60d19da670f783938ed8490248f34edcb28dfcbc248e2ca104e026

jobs:
  windows-installer:
    name: Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Resolve APP_VERSION
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # tag push: v2.0.3 → 2.0.3; workflow_dispatch: 使用输入; 其他 (PR): 默认 2.0.3
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } elseif ($env:INPUT_VERSION) {
            $v = $env:INPUT_VERSION.TrimStart('v')
          } else {
            $v = '2.0.3'
          }
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$v"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "app_version=$v"
          Write-Host "APP_VERSION resolved to $v"

      - name: Check out source
        uses: actions/checkout@v6

      - name: Initialize vcpkg cache directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS | Out-Null
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Restore vcpkg caches
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.VCPKG_DOWNLOADS }}
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: windows-2022-vcpkg-${{ env.VCPKG_TAG }}-${{ hashFiles('cpp/vcpkg.json') }}
          restore-keys: |
            windows-2022-vcpkg-${{ env.VCPKG_TAG }}-

      - name: Install pinned vcpkg
        shell: pwsh
        run: |
          git clone --branch $env:VCPKG_TAG --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          if ($LASTEXITCODE -ne 0) { throw "Failed to clone vcpkg $env:VCPKG_TAG." }

          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "Failed to bootstrap vcpkg." }

      - name: Build PhoneCam Release
        shell: pwsh
        run: |
          & .\cpp\build_release.bat
          if ($LASTEXITCODE -ne 0) { throw "Windows Release build failed." }

      - name: Download and verify published Android APK
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $apkDir = Join-Path $PWD "dist\android-release-input"
          New-Item -ItemType Directory -Force -Path $apkDir | Out-Null
          gh release download $env:ANDROID_APK_RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $env:ANDROID_APK_NAME `
            --dir $apkDir
          if ($LASTEXITCODE -ne 0) { throw "Failed to download trusted Android APK." }

          $apk = Join-Path $apkDir $env:ANDROID_APK_NAME
          if (-not (Test-Path -LiteralPath $apk -PathType Leaf)) {
            throw "Expected Android APK was not downloaded: $apk"
          }
          $actualHash = (Get-FileHash -LiteralPath $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:ANDROID_APK_SHA256) {
            throw "Published Android APK SHA-256 mismatch."
          }

          $checksumPath = "$apk.sha256"
          "$actualHash *$env:ANDROID_APK_NAME" |
            Set-Content -LiteralPath $checksumPath -Encoding ascii -NoNewline
          Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_APK_PATH=$apk"
          Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_APK_CHECKSUM_PATH=$checksumPath"

      - name: Stage and verify runtime dependencies
        shell: pwsh
        run: |
          & .\installer\prepare-dist.ps1 `
            -BuildType Release `
            -AndroidApkPath $env:ANDROID_APK_PATH
          if ($LASTEXITCODE -ne 0) { throw "Dependency staging or verification failed." }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --allow-downgrade --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Failed to install Inno Setup 6.7.1." }

      - name: Compile installer and checksum
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler was not found at $iscc."
          }

          # 版本由 APP_VERSION 注入, 不依赖 phonecam.iss 内的硬编码默认值
          & $iscc "/DMyAppVersion=$env:APP_VERSION" ".\installer\phonecam.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

          $installer = Join-Path $PWD "dist\PhoneCam-$env:APP_VERSION-Setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Expected installer was not created: $installer"
          }

          $checksum = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$installer.sha256"
          "$checksum *$(Split-Path -Leaf $installer)" |
            Set-Content -LiteralPath $checksumPath -Encoding ascii -NoNewline

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: PhoneCam-${{ steps.version.outputs.app_version }}-Windows-x64
          path: |
            dist/PhoneCam-${{ steps.version.outputs.app_version }}-Setup.exe
            dist/PhoneCam-${{ steps.version.outputs.app_version }}-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish_release == true }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $installer = "dist\PhoneCam-$env:APP_VERSION-Setup.exe"
          $checksum = "$installer.sha256"
          $androidApk = $env:ANDROID_APK_PATH
          $androidChecksum = $env:ANDROID_APK_CHECKSUM_PATH

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer $checksum $androidApk $androidChecksum `
              --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $installer $checksum $androidApk $androidChecksum `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "PhoneCam $tag" `
              --generate-notes
          }

          if ($LASTEXITCODE -ne 0) { throw "Failed to publish GitHub Release $tag." }
